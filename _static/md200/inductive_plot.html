<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD200 inductive load test</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.0/plotly.min.js"></script>
<script src="inductive_load_data.js"></script>
<script src="thermal_map.js"></script>
<style>
html, body { margin: 0; height: 100%; background: #fff; font-family: sans-serif; }
#p { width: 100vw; height: 100vh; }
#err { padding: 16px; color: #a00; }
</style>
</head>
<body>
<div id="p"></div>
<script>
/* Interactive plots of the MD200 inductive load test.
   Data source: inductive_load/<voltage>V/<current>.csv (time [s], temperature [C]), packed into
   inductive_load_data.js during the documentation build (_ext/md200_plot_data.py).
   Usage: inductive_plot.html?v=24  - temperature vs time for one supply voltage
          inductive_plot.html?cutoff - time to over-temperature cutoff vs phase current */
var VOLTAGES = [24, 36, 48, 60];
var CURRENTS = [];
for (var i = 10; i <= 200; i += 10) CURRENTS.push(i);
var RUN_LENGTH = 120;
var TAB10 = ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b', '#e377c2', '#7f7f7f', '#bcbd22', '#17becf'];
var CUTOFF_COLORS = { 24: '#FDBA74', 36: '#F97316', 48: '#C2410C', 60: '#7C2D12' };
var CONFIG = { responsive: true, displaylogo: false, modeBarButtonsToRemove: ['select2d', 'lasso2d'] };

function loadCsv(v, a)
{
	var path = 'inductive_load/' + v + 'V/' + a + '.csv';
	return Promise.resolve(MD200_CSV[path]).then(function (text)
	{
		if (text === undefined) throw new Error('missing ' + path);
		var t = [], T = [];
		var lines = text.trim().split('\n');
		for (var k = 1; k < lines.length; k++)
		{
			var c = lines[k].split(',');
			t.push(parseFloat(c[0]));
			T.push(parseFloat(c[1]));
		}
		return { t: t, T: T };
	});
}

function plotVoltage(v)
{
	return Promise.all(CURRENTS.map(function (a) { return loadCsv(v, a); })).then(function (runs)
	{
		var traces = runs.map(function (run, k)
		{
			return { x: run.t, y: run.T, name: CURRENTS[k] + ' A', mode: 'lines',
				line: { color: TAB10[k % 10], width: 1.8 },
				hovertemplate: CURRENTS[k] + ' A<br>%{x:.1f} s<br>%{y:.1f} °C<extra></extra>' };
		});
		traces.push(thermalMapTrace(runs.map(function (run, k) { return { a: CURRENTS[k], t: run.t, T: run.T }; }), 0.25, 1, RUN_LENGTH));
		var layout = { title: { text: v + ' V' }, margin: { l: 60, r: 10, t: 50, b: 50 },
			xaxis: { title: { text: 'Time [s]' }, zeroline: false },
			yaxis: { title: { text: 'Temperature [°C]' }, zeroline: false },
			legend: { title: { text: 'Phase current' }, font: { size: 11 }, tracegroupgap: 0 },
			hovermode: 'closest' };
		addMapSwitch(layout, traces.length - 1, 'Temperature [°C]');
		Plotly.newPlot('p', traces, layout, CONFIG).then(function () { mapFromUrl(layout); });
	});
}

function plotCutoff()
{
	var jobs = [];
	VOLTAGES.forEach(function (v) { CURRENTS.forEach(function (a) { jobs.push(loadCsv(v, a)); }); });
	return Promise.all(jobs).then(function (runs)
	{
		var traces = VOLTAGES.map(function (v, n)
		{
			var x = [], y = [];
			CURRENTS.forEach(function (a, k)
			{
				var t = runs[n * CURRENTS.length + k].t;
				var end = t[t.length - 1];
				if (end < RUN_LENGTH - 0.5) { x.push(a); y.push(end); }   /* run ended by the cutoff */
			});
			return { x: x, y: y, name: v + ' V', mode: 'lines+markers',
				line: { color: CUTOFF_COLORS[v], width: 2.5 }, marker: { size: 7 },
				hovertemplate: v + ' V<br>%{x} A<br>cutoff after %{y:.1f} s<extra></extra>' };
		});
		var layout = { title: { text: 'Time to over-temperature cutoff (inductive load)' },
			margin: { l: 60, r: 10, t: 50, b: 50 },
			xaxis: { title: { text: 'Phase current [A]' }, dtick: 20, showgrid: false },
			yaxis: { title: { text: 'Time to cutoff [s]' }, range: [0, 130], gridcolor: '#e6e6e6' },
			shapes: [{ type: 'line', xref: 'paper', x0: 0, x1: 1, y0: RUN_LENGTH, y1: RUN_LENGTH,
				line: { color: '#909090', dash: 'dash', width: 1 } }],
			annotations: [{ xref: 'paper', x: 1, y: RUN_LENGTH, yanchor: 'bottom', xanchor: 'right', showarrow: false,
				text: 'run length 120 s (lower currents: no cutoff)', font: { color: '#606060' } }],
			hovermode: 'x unified' };
		Plotly.newPlot('p', traces, layout, CONFIG);
	});
}

var q = new URLSearchParams(location.search);
var job = q.has('cutoff') ? plotCutoff() : plotVoltage(parseInt(q.get('v') || '24', 10));
job.catch(function (e)
{
	document.getElementById('p').innerHTML = '<div id="err">Plot data could not be loaded (' + e.message +
		').</div>';
});
</script>
</body>
</html>
